# The release pipeline (gronke/rust-ci release flow). Two paths through one workflow:
#
#   candidate  push to release/v<version> (created by cut.yml) → gate → draft: render the
#              CHANGELOG section into a draft pre-release + push an unsigned v<version>-rcN
#              marker tag + print the release manager's accept/reject runbook.
#   final      the human-signed v<version> tag (the accept command from the runbook) → gate
#              (signature · coherence · seal) → binaries → checksums: the six binaries and
#              SHA256SUMS attach to the still-draft release, and the pipeline stops there.
#   go-live    an admin publishes that draft as a full release — the signal that the assets
#              were inspected. The release must then serve its binary through the action's
#              installer mode — what every `@v0` consumer resolves — before the moving major
#              advances onto it. GitHub's `released` event then advances the moving major (v0)
#              and publishes the crate to crates.io via Trusted Publishing — gated on a
#              human signature: the signed release tag, or a v*-sig companion on the same
#              commit, whose own push (the attest job) completes a publication that was
#              waiting for it. A pre-release does not fire it, so only final releases
#              reach the registry.
#
# The signing key never enters CI: the pipeline only pushes the unsigned rc marker and the
# unsigned moving major, both excluded from the tag-signing ruleset (import the templates
# from gronke/rust-ci's .github/rulesets/).
name: release

on:
  push:
    branches: ["release/v**"]
    tags: ["v*"]
  # An admin turning the draft into a full release is the go-live signal. `released` fires
  # only for non-prereleases, so a pre-release can never reach crates.io.
  release:
    types: [released]
  # cut-release dispatches the first candidate run explicitly — its workflow-token push
  # fires no events.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # branch/tag pushes, gh release create/edit/upload

jobs:
  # Every path starts here: derive the expected version from the ref, require a verified
  # signature on the final tag, and assert the manifest agrees (plus a publish dry-run and
  # the crates.io not-already-published probe via check-release-readiness).
  gate:
    name: gate
    runs-on: ubuntu-latest
    # A release cut from a `v<version>-rcN` marker is not a release: markers are pipeline
    # internals and never reach the registry. On the push paths the coherence check does the
    # distinguishing instead — a marker's manifest version never matches its tag, while a
    # first-class candidate release (Cargo.toml 1.0.0-rc1, tag v1.0.0-rc1) does, so those still
    # cut normally. The bare major (v0) is CI-managed and out of scope.
    if: >-
      ${{ github.event_name == 'release'
          && !contains(github.event.release.tag_name, '-rc')
          || github.event_name != 'release'
          && (github.ref_type != 'tag' || contains(github.ref_name, '.'))
          && !endsWith(github.ref_name, '-sig') }}
    outputs:
      version: ${{ steps.expect.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Expected version from the ref
        id: expect
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # A release event names its tag explicitly; otherwise the ref does.
          if [ -n "${RELEASE_TAG:-}" ]; then
            echo "version=${RELEASE_TAG#v}" >>"$GITHUB_OUTPUT"
          else
            case "$GITHUB_REF" in
              refs/heads/release/v*) echo "version=${GITHUB_REF_NAME#release/v}" >>"$GITHUB_OUTPUT" ;;
              refs/tags/v*)          echo "version=${GITHUB_REF_NAME#v}"          >>"$GITHUB_OUTPUT" ;;
              *)                     echo "version="                              >>"$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Require a signed tag
        if: ${{ github.ref_type == 'tag' }}
        uses: gronke/rust-ci/.github/actions/require-signed-tag@v1

      # verify: false — ci.yml already compiled this very commit; the gate is here for
      # packaging, tag/version coherence and the not-already-published probe.
      - name: Release readiness (version coherence · packaging · crates.io probe)
        uses: gronke/rust-ci/.github/actions/check-release-readiness@v1
        with:
          package: web_modules
          expected-version: ${{ steps.expect.outputs.version }}
          verify: "false"

      # Four API calls, no build: a tag that does not carry the content the
      # candidate build sealed fails here, before the binary matrix runs.
      - name: The tag must seal the newest candidate marker
        if: ${{ github.ref_type == 'tag' && github.event_name == 'push' }}
        uses: gronke/rust-ci/.github/actions/publish-draft-release@v1
        with:
          version: ${{ steps.expect.outputs.version }}
          seal-only: "true"

  # ---- candidate path -------------------------------------------------------------------
  draft:
    name: draft pre-release
    needs: gate
    if: ${{ github.event_name == 'push' && github.ref_type == 'branch' && startsWith(github.ref_name, 'release/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # CHANGELOG section → notes → draft pre-release → rc marker, one step; the
      # runbook lands in the step summary. Binaries build on the final tag, not
      # per candidate — six native runners per review iteration buy nothing.
      - uses: gronke/rust-ci/.github/actions/draft-release@v1
        id: draft
        with:
          version: ${{ needs.gate.outputs.version }}
          package: web_modules

      - uses: gronke/rust-ci/.github/actions/release-guidance@v1
        with:
          version: ${{ needs.gate.outputs.version }}
          marker-tag: ${{ steps.draft.outputs.marker }}
          commit: ${{ github.sha }}
          draft-url: ${{ steps.draft.outputs.url }}

  # ---- final path -------------------------------------------------------------------------
  # Build the CLI binary for each supported target on the signed tag, so the `web-modules
  # build` GitHub Action (root action.yml) can download a prebuilt binary instead of compiling
  # from source. Native runners only — no cross-compilation.
  # One job owns the tag name, so the six binary runners never compete to create
  # it. The candidate path normally drafted the release already; a hand-pushed
  # tag with no candidate run has nothing yet, and this creates it as a DRAFT so
  # the publish gate still decides whether anything goes live.
  release:
    name: the draft the binaries attach to
    needs: gate
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && !endsWith(github.ref_name, '-sig') }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure a draft exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout in this job
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; the binaries will upload to it"
            exit 0
          fi
          gh release create "$tag" --draft --title "$tag" --notes-from-tag --verify-tag
          echo "drafted $tag for the binaries to attach to"

  binaries:
    name: ${{ matrix.slug }}
    needs: [gate, release]
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && !endsWith(github.ref_name, '-sig') }}
    runs-on: ${{ matrix.runner }}
    # windows-arm64 can't be exercised until a real release; tolerate its failure so a hiccup
    # there never blocks the rest — the action falls back to the x86_64 build under emulation.
    continue-on-error: ${{ matrix.slug == 'windows-arm64' }}
    strategy:
      fail-fast: false
      # One native runner per target. `slug` is the release-asset suffix; `ext` the executable
      # extension (Windows only); the trailing comment is the Rust triple built natively there.
      matrix:
        include:
          - { slug: linux-x86_64, runner: ubuntu-latest } # x86_64-unknown-linux-gnu
          - { slug: linux-arm64, runner: ubuntu-24.04-arm } # aarch64-unknown-linux-gnu
          - { slug: macos-arm64, runner: macos-26 } # aarch64-apple-darwin (latest)
          - { slug: macos-x86_64, runner: macos-26-intel } # x86_64-apple-darwin (Intel, latest)
          - { slug: windows-x86_64, runner: windows-latest, ext: .exe } # x86_64-pc-windows-msvc
          - { slug: windows-arm64, runner: windows-11-arm, ext: .exe } # aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      # windows-11-arm ships no Rust (actions/partner-runner-images#77); every other runner has
      # one preinstalled. The shared rust-ci action bootstraps rustup when none is present.
      - name: Ensure Rust toolchain (windows-11-arm ships none)
        if: ${{ matrix.slug == 'windows-arm64' }}
        uses: gronke/rust-ci/.github/actions/install-toolchain@main

      # The full lean toolchain (only the heavy `bundle`/rolldown is excluded) in release mode,
      # reproducibly — `--locked` uses the committed Cargo.lock. Native build: host == target.
      - name: Build
        run: cargo build --release --locked --bin web-modules --features full

      - name: Package
        shell: bash
        env:
          EXT: ${{ matrix.ext }} # ".exe" on Windows, empty elsewhere
        run: |
          set -euo pipefail
          asset="web-modules-${{ matrix.slug }}${EXT}"
          cp "target/release/web-modules${EXT}" "$asset"
          strip "$asset" || true # no-op when strip is absent or can't handle a Windows PE
          ls -lh "$asset"

      # The release already exists — the candidate path drafted it, or the
      # `release` job below created it — so this only ever uploads. Creating it
      # here would race: six runners calling `gh release create --draft` in
      # parallel, and GitHub lets drafts share a tag name, so the losers become
      # rival empty drafts that are indistinguishable in the UI.
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            "web-modules-${{ matrix.slug }}${{ matrix.ext }}" --clobber

  # One combined SHA256SUMS for the release; the action downloads it and verifies the single
  # asset it fetched. Generated on one host, so there is no cross-runner write race.
  checksums:
    name: SHA256SUMS
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Generate + upload SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # no checkout here; point gh at the repo explicitly
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release download "$tag" --pattern 'web-modules-*' --dir dl
          ( cd dl && sha256sum web-modules-* ) > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$tag" SHA256SUMS --clobber

  # The admin's "publish release" is the go-live signal: the assets were inspected,
  # and (with immutable releases on) the tag and assets can no longer change. Only
  # then does the moving major advance and the crate reach crates.io.
  go-live:
    name: go live (moving major · crates.io)
    needs: gate
    # `released` fires only when a full release is published, so a draft or a pre-release
    # cannot reach crates.io — stated explicitly so the guarantee does not rest on the event
    # taxonomy alone. Candidate markers are excluded for the same reason as in the gate.
    if: >-
      ${{ github.event_name == 'release'
          && github.repository == 'gronke/web_modules'
          && !github.event.release.draft
          && !github.event.release.prerelease
          && !contains(github.event.release.tag_name, '-rc') }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write # the moving major tag
      id-token: write # the crates.io Trusted Publishing exchange
    steps:
      # The tag, not the default branch: the crate published must be the tagged tree.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0 # the moving major verifies the target is on the default branch

      # What consumers actually resolve: `uses: gronke/web_modules@v0` downloads a prebuilt
      # binary from the release the moving major points at. Prove this release serves one —
      # the assets attached, the checksum matches, the binary runs and reports its version —
      # before v0 advances onto it. A release that cannot serve its binary leaves v0 where it
      # is, on the last one that could, and the crate stays unpublished with it.
      - name: The published release must serve its binary
        uses: ./
        with:
          build: "false"
          version: ${{ needs.gate.outputs.version }}
      - name: The binary is this release's
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          got="$(web-modules --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*' | head -1)"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::the v${VERSION} release serves web-modules ${got}"
            exit 1
          fi
          echo "✓ v${VERSION} serves web-modules ${got}"

      # Re-seals (idempotent), leaves the already-published release alone, and moves
      # v0 to the highest stable 0.x.
      - uses: gronke/rust-ci/.github/actions/publish-draft-release@v1
        with:
          version: ${{ needs.gate.outputs.version }}
          tag-sha: ${{ github.sha }}
          moving-major: "true"

      # Registry publication is gated on a human signature: the signed release
      # tag satisfies it today, and a v*-sig companion on the same commit would
      # too. Unsigned, the publish step rehearses instead of uploading.
      - id: sig
        uses: gronke/rust-ci/.github/actions/require-signed-release@v1
        with:
          version: ${{ needs.gate.outputs.version }}
          attestation-tags: "v*-sig"

      # Trusted Publishing: a short-lived token from this job's OIDC identity, so no
      # registry secret is stored. crates.io must trust this repository, the
      # release.yml workflow and the crates-io environment.
      - if: steps.sig.outputs.signed == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - uses: gronke/rust-ci/.github/actions/cargo-publish@v1
        with:
          package: web_modules
          publish: ${{ steps.sig.outputs.signed }}
          allow-already-published: "true"

  # A human pushing the signed v<version>-sig companion is the registry go
  # signal — or a retro-attestation. Verify it seals the released commit,
  # reconcile what automation may still owe, and publish the crate if it never
  # was. The signature completes automation; it never publishes drafts.
  attest:
    name: signed attestation (crates.io)
    if: >-
      ${{ github.event_name == 'push' && github.ref_type == 'tag'
          && endsWith(github.ref_name, '-sig') }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write # the moving major, when the reconcile still owes it
      id-token: write # the crates.io Trusted Publishing exchange
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the moving major verifies the target is on the default branch

      # The companion names its own release: the tag it seals is looked up by
      # commit, and a draft is an error — a signature completes automation, it
      # does not publish drafts. `version` and `release-tag` come back out.
      - name: The companion must seal a published release
        id: release
        uses: gronke/rust-ci/.github/actions/require-signed-release@v1
        with:
          attestation-tag: ${{ github.ref_name }}
          require-published: "true"

      # The same gate as the go-live path: the reconcile below can advance v0,
      # so the release must serve its binary first.
      - name: The published release must serve its binary
        uses: ./
        with:
          build: "false"
          version: ${{ steps.release.outputs.version }}
      - name: The binary is this release's
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          got="$(web-modules --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*' | head -1)"
          if [ "$got" != "$VERSION" ]; then
            echo "::error::the v${VERSION} release serves web-modules ${got}"
            exit 1
          fi
          echo "✓ v${VERSION} serves web-modules ${got}"

      # Reconcile idempotently: re-seal, flip no-op, and the moving major
      # catches up if the go-live never ran. Releases cut before the sealed
      # pipeline carry no candidate markers and fail here — nothing to
      # complete for them; their crates were published by hand.
      - uses: gronke/rust-ci/.github/actions/publish-draft-release@v1
        with:
          version: ${{ steps.release.outputs.version }}
          tag-sha: ${{ github.sha }}
          moving-major: "true"

      # The gate above already answered whether a signature covers this commit —
      # the companion that triggered the run is that signature.
      - if: steps.release.outputs.signed == 'true'
        uses: rust-lang/crates-io-auth-action@v1
      - uses: gronke/rust-ci/.github/actions/cargo-publish@v1
        with:
          package: web_modules
          publish: ${{ steps.release.outputs.signed }}
          allow-already-published: "true"
